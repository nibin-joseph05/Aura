name: aura_app
description: "Aura is an AI-powered safety, wellness, and social engagement Flutter application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # --- Firebase ---
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.3
  google_sign_in: ^6.2.1
  firebase_crashlytics: ^4.1.2
  firebase_analytics: ^11.1.0

  # --- Local storage & env ---
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_dotenv: ^5.1.0

  # --- UI / Utils ---
  flutter_svg: ^2.0.10+1
  sms_autofill: ^2.3.0

  # ---  RIVERPOD ---
  flutter_riverpod: ^2.5.1
  riverpod: ^2.5.1

  # --- HTTP / Networking ---
  connectivity_plus: ^5.0.2


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
  hive_generator: ^2.0.1
  build_runner: ^2.3.3

flutter:
  uses-material-design: true

  assets:
    - assets/animations/
    - assets/logos/
    - assets/icons/google/
    - assets/no-internet/
    - .env

flutter_launcher_icons:
  android: true
  ios: true

  image_path: "assets/logos/Aura-app-logo.png" # fallback

  adaptive_icon_foreground: "assets/logos/Aura-app-logo.png"
  adaptive_icon_background: "#2F80ED"

  min_sdk_android: 21
